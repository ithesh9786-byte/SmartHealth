<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHealth Booking</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 10% 15%, rgba(40, 145, 255, 0.18), transparent 28%),
                radial-gradient(circle at 90% 80%, rgba(0, 200, 255, 0.14), transparent 30%),
                linear-gradient(135deg, #eef8ff 0%, #dcefff 50%, #f3fbff 100%);
        }

        /* BACKGROUND DECORATIONS */

        .booking-page {
            min-height: 100vh;
            position: relative;
            padding: 45px 20px;
            overflow: hidden;
        }

        .booking-page::before {
            content: "＋   ♡   ⚕   ＋";
            position: absolute;
            top: 45px;
            right: 55px;
            font-size: 50px;
            letter-spacing: 24px;
            color: rgba(27, 116, 218, 0.08);
            pointer-events: none;
        }

        .booking-page::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            left: -240px;
            bottom: -250px;
            border-radius: 50%;
            background: rgba(43, 152, 245, 0.09);
            pointer-events: none;
        }

        /* MAIN CARD */

        .booking-card {
            position: relative;
            z-index: 2;

            max-width: 1080px;
            margin: 0 auto;

            padding: 42px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.86);

            border: 1px solid rgba(255, 255, 255, 0.9);

            box-shadow:
                0 25px 65px rgba(36, 92, 140, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* HEADER */

        .booking-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 12px;
        }

        .booking-logo {
            width: 58px;
            height: 58px;
            border-radius: 18px;

            display: grid;
            place-items: center;

            background: linear-gradient(145deg, #1269ef, #1ec7f5);

            box-shadow:
                0 12px 25px rgba(20, 119, 255, 0.22),
                inset 0 1px 2px rgba(255,255,255,0.45);
        }

        .booking-title-box h1 {
            margin: 0;
            color: #102c52;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .booking-title-box p {
            margin: 5px 0 0;
            color: #71859f;
            font-size: 14px;
        }

        /* HEALTH LINE */

        .health-line {
            width: 100%;
            height: 1px;
            margin: 25px 0 28px;
            background: linear-gradient(
                90deg,
                transparent,
                #cce0f2,
                transparent
            );
        }

        /* FORM */

        .booking-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 8px;

            margin-bottom: 9px;

            color: #294766;
            font-size: 14px;
            font-weight: 700;
        }

        .label-icon {
            width: 27px;
            height: 27px;
            border-radius: 9px;

            display: grid;
            place-items: center;

            background: #edf6ff;
            color: #1778e9;
        }

        /* INPUTS */

        .input-box {
            position: relative;
        }

        .input-box select,
        .input-box input {
            width: 100%;
            height: 54px;

            padding: 0 16px;

            border: 1px solid #d6e5f2;
            border-radius: 14px;

            background: rgba(248, 252, 255, 0.92);

            color: #29445f;
            font-size: 14px;

            outline: none;

            transition: 0.2s ease;
        }

        .input-box select {
            cursor: pointer;
        }

        .input-box input::placeholder {
            color: #9aabba;
        }

        .input-box select:focus,
        .input-box input:focus {
            border-color: #3794f4;
            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(55, 148, 244, 0.10);
        }

        /* BUTTON */

        .button-area {
            grid-column: 1 / -1;

            display: flex;
            justify-content: flex-end;

            margin-top: 8px;
        }

        .book-button {
            min-width: 210px;
            height: 54px;

            border: none;
            border-radius: 15px;

            background: linear-gradient(
                100deg,
                #1068ef,
                #18b9f3
            );

            color: white;

            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 14px 30px rgba(24, 117, 235, 0.24);

            transition: 0.25s ease;
        }

        .book-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 19px 36px rgba(24, 117, 235, 0.30);
        }

        .book-button:active {
            transform: translateY(0);
        }

        .button-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .button-arrow {
            font-size: 21px;
        }

        /* BOTTOM AREA */

        .booking-bottom {
            margin-top: 27px;
            padding-top: 22px;

            border-top: 1px solid #e8f0f7;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            color: #1776df;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .secure-note {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #7b8fa8;
            font-size: 12px;
            font-weight: 600;
        }

        /* RESPONSIVE */

        @media (max-width: 750px) {

            .booking-page {
                padding: 25px 14px;
            }

            .booking-card {
                padding: 28px 20px;
                border-radius: 23px;
            }

            .booking-title-box h1 {
                font-size: 26px;
            }

            .booking-form {
                grid-template-columns: 1fr;
            }

            .full-width,
            .button-area {
                grid-column: auto;
            }

            .button-area {
                justify-content: stretch;
            }

            .book-button {
                width: 100%;
            }

            .booking-bottom {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }

        @media (max-width: 480px) {

            .booking-header {
                align-items: flex-start;
            }

            .booking-logo {
                width: 50px;
                height: 50px;
                min-width: 50px;
            }

            .booking-title-box h1 {
                font-size: 22px;
            }

            .booking-title-box p {
                font-size: 12px;
                line-height: 1.5;
            }

            .booking-page::before {
                display: none;
            }
        }
    </style>

</head>


<body>

<div class="booking-page">

    <div class="booking-card">

        <!-- HEADER -->

        <div class="booking-header">

            <div class="booking-logo">

                <svg width="34" height="34" viewBox="0 0 48 48" fill="none">

                    <path
                        d="M24 41S7 31 7 18C7 11.4 11.7 7 17.3 7C20.8 7 23 8.9 24 11C25 8.9 27.2 7 30.7 7C36.3 7 41 11.4 41 18C41 31 24 41 24 41Z"
                        fill="white"
                    />

                    <path
                        d="M9 22H17L20.5 14L25 29L28.5 20L31 22H39"
                        stroke="#167CFF"
                        stroke-width="2.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>

            </div>


            <div class="booking-title-box">

                <h1>
                    Book a Health Service
                </h1>

                <p>
                    Schedule your appointment quickly and easily.
                </p>

            </div>

        </div>


        <div class="health-line"></div>


        <!-- FORM -->

        <form method="POST" action="/book" class="booking-form">


            <!-- HEALTH SERVICE -->

            <div class="form-group full-width">

                <label class="form-label">

                    <span class="label-icon">

                        <svg width="16" height="16"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">

                            <path d="M12 3V21"/>
                            <path d="M3 12H21"/>

                        </svg>

                    </span>

                    Health Service

                </label>


                <div class="input-box">

                    <select name="event_name" required>

                        <option value="">
                            Select a health service
                        </option>

                        <option value="General Health Checkup">
                            General Health Checkup
                        </option>

                        <option value="Doctor Consultation">
                            Doctor Consultation
                        </option>

                        <option value="Blood Test">
                            Blood Test
                        </option>

                        <option value="Dental Checkup">
                            Dental Checkup
                        </option>

                        <option value="Eye Checkup">
                            Eye Checkup
                        </option>

                    </select>

                </div>

            </div>



            <!-- DATE -->

            <div class="form-group">

                <label class="form-label">

                    <span class="label-icon">

                        <svg width="16" height="16"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">

                            <rect x="3" y="4" width="18" height="17" rx="3"/>
                            <path d="M16 2V6"/>
                            <path d="M8 2V6"/>
                            <path d="M3 10H21"/>

                        </svg>

                    </span>

                    Date

                </label>


                <div class="input-box">

                    <input
                        type="date"
                        name="event_date"
                        required
                    >

                </div>

            </div>



            <!-- TIME -->

            <div class="form-group">

                <label class="form-label">

                    <span class="label-icon">

                        <svg width="16" height="16"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">

                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 7V12L15 14"/>

                        </svg>

                    </span>

                    Time

                </label>


                <div class="input-box">

                    <input
                        type="time"
                        name="event_time"
                        required
                    >

                </div>

            </div>



            <!-- LOCATION -->

            <div class="form-group full-width">

                <label class="form-label">

                    <span class="label-icon">

                        <svg width="16" height="16"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2">

                            <path d="M20 10C20 15 12 21 12 21S4 15 4 10a8 8 0 1116 0Z"/>

                            <circle cx="12" cy="10" r="2.5"/>

                        </svg>

                    </span>

                    Location

                </label>


                <div class="input-box">

                    <input
                        type="text"
                        name="location"
                        placeholder="Enter appointment location"
                        required
                    >

                </div>

            </div>



            <!-- BUTTON -->

            <div class="button-area">

                <button
                    type="submit"
                    class="book-button"
                >

                    <span class="button-content">

                        <span>
                            Book Appointment
                        </span>

                        <span class="button-arrow">
                            →
                        </span>

                    </span>

                </button>

            </div>

        </form>


        <!-- BOTTOM -->

        <div class="booking-bottom">

            <a
                href="/dashboard"
                class="back-link"
            >
                ← Back to Dashboard
            </a>


            <div class="secure-note">

                <svg width="15" height="15"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <rect x="5" y="10" width="14" height="10" rx="2"/>
                    <path d="M8 10V7a4 4 0 018 0v3"/>

                </svg>

                SmartHealth • Secure Appointment

            </div>

        </div>

    </div>

</div>

</body>
</html>
