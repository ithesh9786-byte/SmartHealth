<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHealth Booking</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="booking-page">

        <div class="booking-card">

            <h1>Book a Health Service</h1>

            <p>Schedule your health service appointment.</p>

            <form method="POST" action="/book">

                <label>Health Service</label>

                <select name="event_name" required>
                    <option value="">Select a service</option>
                    <option value="General Health Checkup">General Health Checkup</option>
                    <option value="Doctor Consultation">Doctor Consultation</option>
                    <option value="Blood Test">Blood Test</option>
                    <option value="Dental Checkup">Dental Checkup</option>
                    <option value="Eye Checkup">Eye Checkup</option>
                </select>

                <label>Date</label>
                <input type="date" name="event_date" required>

                <label>Time</label>
                <input type="time" name="event_time" required>

                <label>Location</label>
                <input type="text" name="location" placeholder="Enter location" required>

                <button type="submit">Book Appointment</button>

            </form>

            <br>

            <a href="/dashboard">← Back to Dashboard</a>

        </div>

    </div>

</body>

</html>
