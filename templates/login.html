<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHealth Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <link rel="icon" href="data:,">
</head>

<body class="bg-[#2d79b3] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-lg text-center">

        <div class="flex justify-center mb-2">
            <span class="text-blue-500 text-3xl">💙</span>
        </div>

        <h2 class="text-2xl font-bold text-[#1a4a75] mb-1">
            SmartHealth
        </h2>

        <p class="text-gray-500 text-sm mb-6">
            Welcome back! Please login to your account.
        </p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Normal Login -->
        <form action="{{ url_for('login') }}" method="POST" class="text-left">

            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-1 text-sm">
                    Email
                </label>

                <input type="email"
                       name="email"
                       required
                       placeholder="admin@gmail.com"
                       class="w-full px-4 py-2 bg-blue-50/50 border border-blue-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-1 text-sm">
                    Password
                </label>

                <div class="relative">
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           placeholder="••••••"
                           class="w-full px-4 py-2 pr-12 bg-blue-50/50 border border-blue-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

                    <button type="button"
                            onclick="togglePassword()"
                            class="absolute right-3 top-2 text-gray-500">
                        👁
                    </button>
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-[#1a4a75] text-white py-2 rounded-lg font-medium hover:bg-[#153b5e] transition">
                Login
            </button>

        </form>

        <!-- OR -->
        <div class="relative flex py-4 items-center justify-center">
            <div class="flex-grow border-t border-gray-200"></div>

            <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">
                OR
            </span>

            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- GOOGLE SIGN IN -->
        <div id="g_id_onload"
             data-client_id="{{ google_client_id }}"
             data-context="signin"
             data-ux_mode="redirect"
             data-login_uri="{{ url_for('google_login', _external=True) }}"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="signin_with"
             data-shape="rectangular"
             data-logo_alignment="left"
             data-width="350">
        </div>

        <!-- REGISTER -->
        <div class="border-t border-gray-100 pt-5 mt-6">

            <p class="text-gray-500 text-sm">
                Don't have an account?

                <a href="{{ url_for('register') }}"
                   class="text-blue-600 font-semibold hover:underline">
                    Register here
                </a>
            </p>

        </div>

        <p class="text-gray-400 text-xs mt-5">
            © 2026 SmartHealth
        </p>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>

</body>
</html>
