<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator - SmartHealth</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="main-content bmi-page">

        <div class="bmi-header">
            <h1>BMI Calculator</h1>
            <p>Calculate your Body Mass Index</p>
        </div>

        <div class="bmi-card">

            <form method="POST">

                <label for="height">Height (cm)</label>

                <input type="number" id="height" name="height" placeholder="Enter your height" step="0.1" min="1"
                    required>

                <label for="weight">Weight (kg)</label>

                <input type="number" id="weight" name="weight" placeholder="Enter your weight" step="0.1" min="1"
                    required>

                <button type="submit" class="bmi-btn">
                    Calculate BMI
                </button>

            </form>

            {% if bmi is not none %}

            <div class="bmi-result">

                <p>Your BMI</p>

                <h2>{{ "%.1f"|format(bmi) }}</h2>

                <h3>{{ category }}</h3>

            </div>

            {% endif %}

            <a href="/dashboard" class="back-btn">
                ← Back to Dashboard
            </a>

        </div>

    </main>

</body>

</html>
