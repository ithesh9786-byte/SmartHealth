<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHealth Register</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" href="data:,">
</head>

<body class="bg-[#2d79b3] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-lg text-center">

        <!-- Logo -->
        <div class="flex justify-center mb-2">
            <span class="text-blue-500 text-3xl">💙</span>
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-bold text-[#1a4a75] mb-1">
            SmartHealth
        </h2>

        <p class="text-gray-500 text-sm mb-6">
            Create your account
        </p>


        <!-- Messages -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}


        <!-- Register Form -->
        <form action="{{ url_for('register') }}" method="POST" class="text-left">

            <!-- Full Name -->
            <div class="mb-4">

                <label class="block text-gray-700 font-medium mb-1 text-sm">
                    Full Name
                </label>

                <input type="text" name="name" required placeholder="Enter your full name"
                    class="w-full px-4 py-2 bg-blue-50/50 border border-blue-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

            </div>


            <!-- Email -->
            <div class="mb-4">

                <label class="block text-gray-700 font-medium mb-1 text-sm">
                    Email
                </label>

                <input type="email" name="email" required placeholder="admin@gmail.com"
                    class="w-full px-4 py-2 bg-blue-50/50 border border-blue-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label class="block text-gray-700 font-medium mb-1 text-sm">
                    Password
                </label>

                <div class="relative">

                    <input type="password" id="password" name="password" required minlength="6"
                        placeholder="Enter password"
                        class="w-full px-4 py-2 pr-12 bg-blue-50/50 border border-blue-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

                    <button type="button" id="togglePassword" onclick="togglePasswordVisibility()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-600"
                        title="Show password">
                        👁️
                    </button>

                </div>

            </div>


            <!-- Confirm Password -->
            <div class="mb-6">

                <label class="block text-gray-700 font-medium mb-1 text-sm">
                    Confirm Password
                </label>

                <div class="relative">

                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                        placeholder="Confirm password"
                        class="w-full px-4 py-2 pr-12 bg-blue-50/50 border border-blue-100 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

                    <button type="button" id="toggleConfirmPassword" onclick="toggleConfirmPasswordVisibility()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-600"
                        title="Show password">
                        👁️
                    </button>

                </div>

            </div>


            <!-- Create Account -->
            <button type="submit"
                class="w-full bg-[#1a4a75] text-white py-2 rounded-lg font-medium hover:bg-[#153b5e] transition duration-200">
                Create Account
            </button>

        </form>


        <!-- OR -->
        <div class="relative flex py-4 items-center justify-center">

            <div class="flex-grow border-t border-gray-200"></div>

            <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase">
                OR
            </span>

            <div class="flex-grow border-t border-gray-200"></div>

        </div>


        <!-- Login Option -->
        <p class="text-gray-500 text-sm">

            Already have an account?

            <a href="{{ url_for('login') }}" class="text-blue-600 font-semibold hover:underline">
                Login here
            </a>

        </p>


        <!-- Copyright -->
        <p class="text-gray-400 text-xs mt-5">
            © 2026 SmartHealth
        </p>

    </div>


    <!-- Password Show / Hide -->
    <script>

        function togglePasswordVisibility() {

            const password = document.getElementById("password");
            const button = document.getElementById("togglePassword");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "🙈";
                button.title = "Hide password";

            } else {

                password.type = "password";
                button.textContent = "👁️";
                button.title = "Show password";

            }
        }


        function toggleConfirmPasswordVisibility() {

            const password = document.getElementById("confirm_password");
            const button = document.getElementById("toggleConfirmPassword");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "🙈";
                button.title = "Hide password";

            } else {

                password.type = "password";
                button.textContent = "👁️";
                button.title = "Show password";

            }
        }

    </script>

</body>

</html>
